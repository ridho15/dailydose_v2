name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  typescript:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: dailydose_ci
          MYSQL_USER: dailydose
          MYSQL_PASSWORD: dailydose_ci
          MYSQL_ROOT_PASSWORD: dailydose_root_ci
        ports: ['3306:3306']
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -u dailydose -pdailydose_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: mysql://dailydose:dailydose_ci@127.0.0.1:3306/dailydose_ci
      QUOTA_EVALUATION_SYNTHETIC_ENABLED: 'true'
      QUOTA_EVALUATION_POLL_INTERVAL_MS: '10000'
      QUOTA_EVALUATION_LEASE_MS: '30000'
      QUOTA_EVALUATION_MAX_ATTEMPTS: '5'
      QUOTA_EVALUATION_BACKOFF_MS: '60000'
      AUTH_SYNTHETIC_ENABLED: 'true'
      BOOKING_SYNTHETIC_ENABLED: 'true'
      BOOKING_SYNTHETIC_CUTOFF_HOURS: '2'
      RESCHEDULE_SYNTHETIC_ENABLED: 'true'
      RESCHEDULE_SYNTHETIC_CUTOFF_HOURS: '24'
      BOOKING_CANCELLATION_ENABLED: 'true'
      BOOKING_CANCELLATION_CUTOFF_HOURS: '24'
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with: { version: 11.7.0 }
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Create local environment file for Node CLI
        run: cp .env.example .env
      - run: pnpm openapi:validate
      - run: pnpm openapi:drift
      - name: Generate Prisma Client
        run: pnpm db:generate
      - name: Apply database migrations
        run: pnpm db:migrate
      - name: Validate demo seed
        run: pnpm db:seed
      # API Jest imports the workspace config package directly. Build its ESM
      # declarations first so a clean runner does not depend on stale artifacts.
      - name: Reset database for integration tests
        run: >
          node --env-file=.env
          apps/api/node_modules/prisma/build/index.js
          migrate reset
          --force
          --skip-seed
          --schema apps/api/prisma/schema.prisma
      - name: Build shared configuration
        run: pnpm --filter @dailydose/config build
      - run: pnpm check
      - name: Cache Playwright browser binaries
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install Playwright Chromium with dependencies
        run: pnpm --filter @dailydose/web exec playwright install --with-deps chromium
      - name: Run E2E tests
        run: pnpm --filter @dailydose/web test:e2e
  dart-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with: { flutter-version: 3.38.5, channel: stable, cache: true }
      - run: flutter pub get
        working-directory: packages/api-client-dart/lib/generated/client
      - name: Regenerate built_value files
        run: dart run build_runner build --delete-conflicting-outputs
        working-directory: packages/api-client-dart/lib/generated/client
      - name: Verify generated Dart client drift
        run: git diff --exit-code -- packages/api-client-dart
      - run: flutter pub get
        working-directory: packages/api-client-dart
      - run: dart test
        working-directory: packages/api-client-dart
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with: { fetch-depth: 0 }
      - name: Scan full Git history with Gitleaks
        run: >-
          docker run --rm
          -v "$PWD:/repo"
          -w /repo
          zricethezav/gitleaks:v8.24.3
          git --redact --verbose --log-opts="--all" .
